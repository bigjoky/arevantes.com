openapi: 3.1.0
info:
  title: Arevantes Mobile API
  version: 1.3.0
servers:
  - url: https://arevantes.com/api/mobile/v1
security:
  - bearerAuth: []
paths:
  /commercial/field:
    get:
      operationId: listCommercialFieldActivity
      description: Own activity; team scope requires supervise-commercial-field. Requires mobile ability and manage-operations. Period is limited to 366 days.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: user_id, in: query, schema: { type: integer }, description: "Ignored without supervision permission" }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: "Paginated visits (30/page), actual-time KPIs, sessions, route options and catalogs in data" }
        '403': { description: "Missing field access or mobile access" }
        '422': { $ref: '#/components/responses/ValidationError' }
  /commercial/field/visits:
    post:
      operationId: recordColdCommercialVisit
      description: Requires record-commercial-field; no person or opportunity is created. Client UUID retries return the original visit.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_uuid, prospect_type, outcome, visited_at]
              properties:
                client_uuid: { type: string, format: uuid }
                prospect_type: { type: string, enum: [residential, business, community] }
                outcome: { type: string, enum: [no_answer, not_interested, interested, follow_up, not_accessible, do_not_contact] }
                visited_at: { type: string, format: date-time, description: "Actual instant within the previous 30 days, not future" }
                commercial_route_plan_id: { type: [integer, 'null'], description: "Own route on the visit date" }
                latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
                longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
                accuracy_meters: { type: [number, 'null'], minimum: 0, maximum: 100000 }
                address: { type: [string, 'null'], maxLength: 255 }
                notes: { type: [string, 'null'], maxLength: 3000 }
      responses:
        '201': { description: "Minimal visit IDs and state; coordinates and notes are not persisted in the idempotency response" }
        '403': { description: "Missing recording permission" }
        '409': { description: "Client UUID belongs to another user or operation in progress" }
        '422': { $ref: '#/components/responses/ValidationError' }
  /commercial/field/sessions:
    post:
      operationId: startCommercialFieldSession
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201': { description: "Session ID and server start instant" }
        '403': { description: "Missing recording permission" }
        '422': { description: "Session already open or missing idempotency UUID" }
  /commercial/field/sessions/{session}/stop:
    patch:
      operationId: stopCommercialFieldSession
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: session, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ended_at: { type: [string, 'null'], format: date-time, description: "Optional corrected end after start and last session visit, not future; defaults to now" }
      responses:
        '201': { description: "Closed session; repeated close returns original end" }
        '404': { description: "Session does not belong to user" }
        '422': { $ref: '#/components/responses/ValidationError' }
  /commercial/field/visits/{visit}/convert:
    post:
      operationId: convertColdVisitToOpportunity
      description: Requires record-commercial-field and manage-customers. Own interested/follow_up visit only. Repeated conversion returns original linked IDs.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: visit, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferred_contact_channel, consent_status, service_interest, next_action_at]
              properties:
                first_name: { type: [string, 'null'], maxLength: 255, description: "Required without company_name" }
                company_name: { type: [string, 'null'], maxLength: 255 }
                last_name: { type: [string, 'null'], maxLength: 255 }
                phone: { type: [string, 'null'], maxLength: 40, description: "Valid mobile required without email" }
                email: { type: [string, 'null'], format: email }
                preferred_contact_channel: { type: string, enum: [phone, whatsapp, email, sms] }
                consent_status: { type: string, enum: [not_recorded, granted, denied] }
                consent_notes: { type: [string, 'null'], maxLength: 1000 }
                service_interest: { type: string, description: "Value from field dashboard serviceInterests catalog" }
                next_action_at: { type: string, format: date-time, description: "After visited_at" }
                estimated_value: { type: [number, 'null'], minimum: 0 }
      responses:
        '201': { description: "Linked visit, person and opportunity IDs" }
        '200': { description: "Visit was already converted; same linked IDs" }
        '404': { description: "Visit does not belong to user" }
        '422': { $ref: '#/components/responses/ValidationError' }
  /commercial/field/routes:
    post:
      operationId: assignCommercialFieldSector
      description: Requires supervise-commercial-field. Preserves existing route and CRM stops.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, route_date, sector_label]
              properties:
                user_id: { type: integer, description: "User with record-commercial-field permission" }
                route_date: { type: string, format: date, description: "Today to 30 days ahead" }
                sector_label: { type: string, maxLength: 150 }
                instructions: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201': { description: "Assigned route ID" }
        '403': { description: "Missing supervision permission" }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, maxLength: 120 }
                two_factor_code: { type: [string, 'null'], pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Device token and current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      expires_at: { type: string, format: date-time }
                      user: { $ref: '#/components/schemas/User' }
        '403': { description: User lacks the manage-operations permission }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/token:
    delete:
      operationId: logout
      responses:
        '204': { description: Token revoked }
  /me:
    get:
      operationId: currentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
  /devices/{deviceId}:
    put:
      operationId: registerMobileDevice
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token, environment]
              properties:
                push_token: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                environment: { type: string, enum: [development, production] }
                app_version: { type: [string, 'null'], maxLength: 40 }
      responses:
        '200': { description: Device registered or updated }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: revokeMobileDevice
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Device revoked }
  /activities:
    get:
      operationId: listAssignedActivities
      parameters:
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200':
          description: Active, installation-linked and unconverted activities assigned to the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Activity' } }
  /activities/{activity}:
    get:
      operationId: getAssignedActivity
      parameters: [{ $ref: '#/components/parameters/ActivityId' }]
      responses:
        '200':
          description: Assigned activity details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
        '403': { description: Activity is not assigned to the current user }
  /activities/{activity}/status:
    patch:
      operationId: changeAssignedActivityStatus
      parameters:
        - { $ref: '#/components/parameters/ActivityId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ActivityStatus' }
                blocked_reason: { type: [string, 'null'], maxLength: 1000, description: Required when status is blocked. }
      responses:
        '200': { description: Activity status changed or a previous response replayed }
        '403': { description: Activity is not assigned to the current user }
        '422': { $ref: '#/components/responses/ValidationError' }
  /work-orders:
    get:
      operationId: listWorkOrders
      parameters:
        - { name: updated_after, in: query, schema: { type: string, format: date-time } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WorkOrderStatus' } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Accessible work orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/WorkOrder' } }
                  running_time_entry:
                    type: [object, 'null']
                    properties:
                      id: { type: integer }
                      client_uuid: { type: [string, 'null'], format: uuid }
                      started_at: { type: string, format: date-time }
                      work_order_id: { type: integer }
  /work-orders/{workOrder}:
    get:
      operationId: getWorkOrder
      parameters: [{ $ref: '#/components/parameters/WorkOrderId' }]
      responses:
        '200':
          description: Work order details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkOrder' }
        '403': { description: Not assigned to this technician }
  /work-orders/{workOrder}/timer:
    post:
      operationId: startTimer
      parameters:
        - { $ref: '#/components/parameters/WorkOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_uuid: { type: [string, 'null'], format: uuid, description: Device-generated identifier used to stop an offline timer after synchronization. }
                started_at: { type: [string, 'null'], format: date-time, description: "Device capture time, no more than seven days old." }
      responses:
        '201': { description: Timer started }
        '422': { description: Another timer is active or order cannot be executed }
  /time-entries/{timeEntry}/stop:
    patch:
      operationId: stopTimer
      parameters:
        - { name: timeEntry, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ended_at: { type: [string, 'null'], format: date-time }
                travel_km: { type: number, minimum: 0 }
                notes: { type: [string, 'null'] }
      responses:
        '200': { description: Timer stopped }
  /time-entries/client/{clientUuid}/stop:
    patch:
      operationId: stopTimerByClientUuid
      parameters:
        - { name: clientUuid, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ended_at]
              properties:
                ended_at: { type: string, format: date-time }
                travel_km: { type: number, minimum: 0 }
                notes: { type: [string, 'null'] }
      responses:
        '200': { description: Offline-created timer stopped }
        '404': { description: Client timer identifier not found for this user }
  /work-orders/{workOrder}/complete:
    patch:
      operationId: completeWorkOrder
      parameters:
        - { $ref: '#/components/parameters/WorkOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completion_notes]
              properties:
                completion_notes: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200': { description: Work order completed or a previous response replayed }
        '422': { description: Completion requirements are not satisfied }
  /work-orders/{workOrder}/status:
    patch:
      operationId: changeWorkOrderStatus
      parameters:
        - { $ref: '#/components/parameters/WorkOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [blocked, planned, in_progress] }
                blocked_reason: { type: [string, 'null'], maxLength: 1000, description: Required when status is blocked. }
      responses:
        '200': { description: Work order status changed or a previous response replayed }
        '422': { description: "Transition is not allowed, reason is missing, or a timer is running" }
  /work-orders/{workOrder}/materials/{reservation}/consume:
    post:
      operationId: consumeReservedMaterial
      parameters:
        - { $ref: '#/components/parameters/WorkOrderId' }
        - { name: reservation, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: number, exclusiveMinimum: 0 }
                serials: { type: [string, 'null'], maxLength: 10000 }
      responses:
        '200': { description: Material consumption stored or a previous response replayed }
  /work-orders/{workOrder}/checklist/{item}:
    patch:
      operationId: updateChecklist
      parameters:
        - { $ref: '#/components/parameters/WorkOrderId' }
        - { name: item, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean }
                notes: { type: [string, 'null'] }
      responses:
        '200': { description: Checklist item updated }
  /work-orders/{workOrder}/attachments:
    post:
      operationId: uploadWorkOrderAttachment
      parameters:
        - { $ref: '#/components/parameters/WorkOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                caption: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201':
          description: Evidence stored or a previous response replayed
        '403': { description: Work order is not accessible to the technician }
        '422': { $ref: '#/components/responses/ValidationError' }
  /work-orders/{workOrder}/signature:
    post:
      operationId: uploadWorkOrderSignature
      parameters:
        - { $ref: '#/components/parameters/WorkOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [signed_by_name, signature]
              properties:
                signed_by_name: { type: string, maxLength: 255 }
                signature: { type: string, format: binary, description: PNG up to 750 KB }
      responses:
        '201':
          description: Signature stored or a previous response replayed
        '403': { description: Work order is not accessible to the technician }
        '422': { $ref: '#/components/responses/ValidationError' }
  /work-orders/{workOrder}/arrivals:
    post:
      operationId: recordWorkOrderArrival
      parameters:
        - { $ref: '#/components/parameters/WorkOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, arrived_at]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracy_meters: { type: [number, 'null'], minimum: 0, maximum: 10000 }
                arrived_at: { type: string, format: date-time }
      responses:
        '201': { description: Arrival stored or a previous response replayed }
        '403': { description: Work order is not accessible to the technician }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ActivityId: { name: activity, in: path, required: true, schema: { type: integer } }
    WorkOrderId: { name: workOrder, in: path, required: true, schema: { type: integer } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated once by the device and reused for every retry of the same mutation.
      schema: { type: string, format: uuid }
  responses:
    ValidationError: { description: Invalid input }
  schemas:
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, commercial, technician] }
    WorkOrderStatus: { type: string, enum: [planned, in_progress, blocked, completed, cancelled] }
    ActivityStatus: { type: string, enum: [pending, in_progress, blocked, completed] }
    Activity:
      type: object
      required: [id, type, title, priority, status, updated_at]
      properties:
        id: { type: integer }
        type: { type: string, enum: [task, visit, reminder, call, email, meeting] }
        title: { type: string }
        priority: { type: string, enum: [low, normal, high] }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        blocked_reason: { type: [string, 'null'] }
        starts_at: { type: [string, 'null'], format: date-time }
        due_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
        notes: { type: [string, 'null'] }
        installation:
          type: [object, 'null']
          properties:
            id: { type: integer }
            project_reference: { type: [string, 'null'] }
            site_name: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
            postal_code: { type: [string, 'null'] }
            latitude: { type: [number, 'null'] }
            longitude: { type: [number, 'null'] }
    WorkOrder:
      type: object
      required: [id, number, title, status, updated_at]
      properties:
        id: { type: integer }
        number: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/WorkOrderStatus' }
        blocked_reason: { type: [string, 'null'] }
        allowed_transitions:
          type: array
          items: { $ref: '#/components/schemas/WorkOrderStatus' }
        scheduled_start: { type: [string, 'null'], format: date-time }
        scheduled_end: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
        instructions: { type: [string, 'null'] }
        completion_notes: { type: [string, 'null'] }
        signed_by_name: { type: [string, 'null'] }
        signed_at: { type: [string, 'null'], format: date-time }
        installation:
          type: [object, 'null']
          properties:
            id: { type: integer }
            project_reference: { type: [string, 'null'] }
            site_name: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
            postal_code: { type: [string, 'null'] }
            latitude: { type: [number, 'null'] }
            longitude: { type: [number, 'null'] }
