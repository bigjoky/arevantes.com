name: deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Write DEPLOY to publish production'
        required: true

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy arevantes.com
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Confirm production deployment
        if: ${{ inputs.confirmation != 'DEPLOY' }}
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm

      - name: Build production release
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          npm run build
          npm run types:check
          rm -rf node_modules

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/arevantes_deploy
          chmod 600 ~/.ssh/arevantes_deploy
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Verify server requirements
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PHP_BINARY: ${{ secrets.DEPLOY_PHP_BINARY }}
        run: |
          ssh -i ~/.ssh/arevantes_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "'$DEPLOY_PHP_BINARY' -r 'exit(version_compare(PHP_VERSION, \"8.4.1\", \">=\") ? 0 : 1);' && mkdir -p '$DEPLOY_PATH'"

      - name: Enable maintenance mode
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PHP_BINARY: ${{ secrets.DEPLOY_PHP_BINARY }}
        run: |
          ssh -i ~/.ssh/arevantes_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "if [ -f '$DEPLOY_PATH/artisan' ]; then cd '$DEPLOY_PATH' && '$DEPLOY_PHP_BINARY' artisan down --retry=60; fi"

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='database/database.sqlite' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='tests/' \
            -e "ssh -i ~/.ssh/arevantes_deploy -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Finalize release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PHP_BINARY: ${{ secrets.DEPLOY_PHP_BINARY }}
        run: |
          ssh -i ~/.ssh/arevantes_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$DEPLOY_PATH'
            mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs database
            touch database/database.sqlite
            chmod -R ug+rw storage database/database.sqlite
            test -f .env || { echo 'Production .env is missing'; exit 1; }
            trap \"'$DEPLOY_PHP_BINARY' artisan up || true\" EXIT
            '$DEPLOY_PHP_BINARY' artisan migrate --force
            '$DEPLOY_PHP_BINARY' artisan storage:link || true
            '$DEPLOY_PHP_BINARY' artisan optimize
            '$DEPLOY_PHP_BINARY' artisan up
            trap - EXIT
          "

      - name: Verify public health endpoint
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 https://www.arevantes.com/up
